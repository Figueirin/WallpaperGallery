name: Sincronizacao Diaria do Catalogo Steam

on:
  schedule:
    # Executa todos os dias às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparo manual no painel do GitHub Actions a qualquer momento

permissions:
  contents: write

jobs:
  sync-steam-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        run: npm ci || npm install

      - name: Executar Sincronização Incremental com Steam Workshop
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          npm run sync:workshop -- --mode=all --pages=3

      - name: Salvar e Publicar Catálogo Atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog.json
          if git diff --staged --quiet; then
            echo "Nenhum novo wallpaper detectado hoje. Catálogo mantido inalterado."
          else
            git commit -m "chore(catalog): daily automated steam workshop sync [skip ci]"
            git push
            echo "Catálogo atualizado e publicado com sucesso!"
          fi
