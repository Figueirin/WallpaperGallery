name: Validacao offline do catalogo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallpaper-catalog-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
